name: CI
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run coverage

  publish-firefox:
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:release
      - run: npx web-ext lint --source-dir dist-firefox
      - run: npx web-ext build --source-dir dist-firefox --artifacts-dir artifacts --overwrite-dest
      - name: Sign and publish to AMO
        run: npx web-ext sign --source-dir dist-firefox --artifacts-dir artifacts --channel listed --amo-metadata amo-metadata.json --timeout 900000 || echo "Timed out waiting for approval — submission was successful, check AMO dashboard"
        env:
          WEB_EXT_API_KEY: ${{ secrets.WEB_EXT_API_KEY }}
          WEB_EXT_API_SECRET: ${{ secrets.WEB_EXT_API_SECRET }}
      - uses: actions/upload-artifact@v5
        with:
          name: xun-firefox
          path: artifacts/*.xpi

